<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Frontend</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://db.onlinewebfonts.com/c/8b8821ce464b5a4f4eb91cc78e57b2d7?family=Myriad+Pro+Semibold+SemiCondensed" rel="stylesheet" type="text/css"/>
</head>
<body>
    <header class="header">
        
        <!-- LEFT: Logo -->
    <div class="logo">
    <svg class="logo-svg" viewBox="0 0 400 100">

        <!-- Main text -->
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
              class="glitch-text main">
            NEONSHOP
        </text>

        <!-- Glitch layers -->
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
              class="glitch-text glitch1">
            NEONSHOP
        </text>

        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
              class="glitch-text glitch2">
            NEONSHOP
        </text>

    </svg>
</div>

    <!-- CENTER: Navigation -->
    <nav class="nav">
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- RIGHT: Search + Cart -->
    <div class="right-section">

        <!-- Search -->
        <div class="search-box">
            <input type="text" placeholder="Search products...">
        </div>

        <!-- Cart -->
        <a href="cart.html" class="cart">
            🛒
            <span class="cart-count">0</span>
        </a>

        <div class="auth-buttons">

            <p id="userEmail"></p>
        
            <a href="auth.html" class="login-btn" id="loginBtn">
                Login
            </a>
        
            <button class="logout-btn" id="logoutBtn">
                Logout
            </button>

            <p id="userEmail"></p>
        
        </div>

        <!-- Hamburger -->
        <div class="hamburger">
            ☰
        </div>

    </div>

</header>
<section class="hero">

    <!-- SLIDER IMAGES -->
    <div class="hero-slider">
        <img src="assets/samsung.webp" class="active">
        <img src="assets/cosmetics copy.webp">
        <img src="assets/garments.webp">
        <img src="assets/grocery.webp">
        <img src="assets/furniture copy.webp">
        <img src="assets/tv.webp">
        <img src="assets/sports copy.webp" alt="">
    </div>
    <button class="slider-btn prev">&#10094;</button>
    <button class="slider-btn next">&#10095;</button>

    <!-- CONTENT OVER IMAGE -->
    <!-- <div class="hero-content">
        <h1>Biggest Sale of the Year!</h1>
        <p>Up to 50% off on all products</p>
        <a href="#products" class="cta-btn">Shop Now</a>
    </div> -->

</section>
<section class="categories">
    <div class="category-list">
        <div class="category-item">
            <img src="assets/Icon1 copy.jpg" alt="Electronics">
            <p>Electronics</p>
        </div>
        <div class="category-item">
            <img src="assets/Icon2 copy.jpg" alt="Fashion">
            <p>Fashion</p>
        </div>
        <div class="category-item">
            <img src="assets/Icon3 copy.jpg" alt="Home & Living">
            <p>Home Decors</p>
        </div>
        <div class="category-item">
            <img src="assets/Icon4 copy.jpg" alt="Beauty & Personal Care">
            <p>Beauty & Care</p>
        </div>
        <div class="category-item">
            <img src="assets/Icon5 copy.jpg" alt="Grocery">
            <p>Grocery</p>
        </div>
        <div class="category-item">
            <img src="assets/Icon6 copy.jpg" alt="Sports & Outdoors">
            <p>Sports & Outdoors</p>
        </div>
    </div>

</section>
<section class="products">
    <!-- <h2>Products</h2> -->

    <div class="product-grid" id="productGrid">
        <p id="loading">Loading products...</p>
        <!-- JS will fill this -->
    </div>
</section>
<footer>
    <div class="footup">
        <p>&copy; 2026 NeonShop. All rights reserved.</p>
    </div>
    <div class="footdown">
        <p>Follow us on social media for the latest updates and exclusive offers!</p>
        <div class="social-icons">
            <a href="#"><img src="assets/Social_Facebook_White.webp" alt="Facebook"></a>
            <a href="#"><img src="assets/Social_Twitter_White.webp" alt="Twitter"></a>
            <a href="#"><img src="assets/Social_Insta_White.webp" alt="Instagram"></a>
            <!-- <a href="#"><img src="assets/Social_LinkedIn_White.webp" alt="LinkedIn"></a> -->
        </div>
    </div>
</footer>
    <script type="module" src="scripts/app.js"></script>

</body>
</html>
